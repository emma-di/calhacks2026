name: Frontend checks
on:
  push:
    paths: ['frontend/**', 'audio/alert*', 'audio/events.py', 'hardware/**', 'scripts/verify_alert_parity.py', '.github/workflows/frontend-checks.yml']
  pull_request:
    paths: ['frontend/**', 'audio/alert*', 'audio/events.py', 'hardware/**', 'scripts/verify_alert_parity.py', '.github/workflows/frontend-checks.yml']
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Cross-language notification stress test (no hardware)
        run: python ../scripts/verify_alert_parity.py --steps 10000
