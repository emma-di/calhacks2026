name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install fast-test dependency
        run: python -m pip install 'numpy<3'
      - name: Unit tests (no model downloads or microphone)
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q audio
