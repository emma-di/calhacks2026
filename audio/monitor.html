<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audio pipeline monitor</title>
<style>
body{background:#101716;color:#e7f7ee;font:18px system-ui;max-width:900px;margin:50px auto;padding:24px}h1{font-size:26px}small,p{color:#a9c3b7}#cue{border:2px solid #81c4a0;border-radius:20px;padding:48px;font-size:46px;min-height:100px}button{padding:12px 24px;font:inherit;margin:16px 0;cursor:pointer}pre{white-space:pre-wrap;font-size:13px}#status{color:#c6db8b}
</style>
<h1>Sound → event → alert</h1><p id="status">Connecting…</p>
<p>This monitor receives events. Start the microphone CLI separately. “Ready” does not mean a microphone is listening.</p>
<div id="cue" role="status" aria-live="polite">Waiting for an event</div>
<p id="meta"></p><button id="dismiss">Dismiss alert</button>
<h2>Latest event JSON</h2><pre id="json">No events received</pre>
<script>
const cue=document.querySelector('#cue'),meta=document.querySelector('#meta');
let lastId=null;
document.querySelector('#dismiss').onclick=()=>fetch('/dismiss',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event_id:lastId})});
async function poll(){
 try{
  const response=await fetch('/state');if(!response.ok)throw Error('Disconnected');
  const state=await response.json();document.querySelector('#status').textContent='Event receiver ready · local processing';
  const event=state.active;
  if((event?.event_id??null)!==lastId){
   lastId=event?.event_id??null;cue.textContent=event?event.label:'Waiting for an event';
   meta.textContent=event?`Tier ${event.priority_tier} · ${event.source} · model score ${Number.isFinite(event.confidence)?event.confidence.toFixed(2):'unavailable'} · direction ${state.direction??'unknown'}`:'';
  }
  const latest=state.events.at(-1);document.querySelector('#json').textContent=latest?JSON.stringify(latest,null,2):'No events received';
 }catch(e){document.querySelector('#status').textContent='Disconnected — receiver unavailable';cue.textContent='Disconnected';meta.textContent='';lastId=null;}
 setTimeout(poll,250);
}poll();
</script></html>
